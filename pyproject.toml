[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest", "ruff"]

[project]
name = "go-starter"
version = "0.0.1"
description = "Scaffold a new Go project from a bundled template"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
go-starter = "go_starter.main:main"

[tool.ruff.lint]
select = ["N"]

[tool.setuptools.package-data]
# Plain * never matches a leading dot, and ** never descends into
# hidden directories, so the dotfile and .github globs are required
# or those files silently vanish from the wheel.
go_starter = [
    "template/**/*",
    "template/**/.*",
    "template/.github/workflows/*",
    "skills/**/*",
]
